<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Funkübung Technikfragen</title>
<style>
:root{
  --bg:#17202B; --panel:#1F2B38; --panel2:#283748; --line:#3A4A5C;
  --fg:#F5F2EB; --muted:#C9D1DA; --red:#B8321F; --red2:#D9442F; --amber:#F0B03C; --green:#4FA36A;
  --h:'Oswald','Arial Narrow','Roboto Condensed','Franklin Gothic Medium',Impact,sans-serif;
  --b:'Public Sans','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--b);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-family:var(--h);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:22px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.bar{height:3px;background:var(--red2);margin:12px 0 18px}
.lbl{font-family:var(--h);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted);margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-width:64px;padding:12px 10px;text-align:center;border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;font-family:var(--h);font-size:20px;letter-spacing:.03em;cursor:pointer}
.pill.on{background:var(--red);border-color:var(--red2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.qn{font-family:var(--h);text-transform:uppercase;letter-spacing:.06em;color:var(--amber);font-size:15px}
.qt{font-weight:700;margin:4px 0 4px;font-size:18px}
.ql{margin:0 0 12px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.opt b{font-family:var(--h);font-size:20px;color:var(--amber);min-width:20px}
.small{color:var(--muted);font-size:13px;margin-top:22px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:0}
.hide{display:none}
.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt.on{background:var(--red);border-color:var(--red2)}
.opt.on b{color:var(--fg)}
.btn{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:8px;background:var(--red2);color:#fff;font-family:var(--h);font-size:20px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn[disabled]{background:var(--panel2);color:var(--muted);cursor:default}
.msg{margin-top:18px;padding:16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:17px}
.msg.ok{border-color:var(--green)}
.msg h2{font-family:var(--h);text-transform:uppercase;letter-spacing:.05em;font-size:20px;margin-bottom:4px}
.msg.ok h2{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Technikfragen</h1>
  <div class="sub" id="st">Station</div>
  <div class="bar"></div>

  <div id="pick">
    <div class="lbl">Deine Einheit</div>
    <div class="pills" id="pills"></div>
  </div>

  <div id="state" class="msg hide"></div>

  <div id="out" class="hide">
    <div class="lbl" id="who"></div>
    <div id="qs"></div>
    <button class="btn" id="send" disabled>Antworten abschicken</button>
    <p class="small"><button class="link" id="chg">Andere Einheit wählen</button></p>
  </div>
</div>

<script>
/* ===== DATA: Fragenpool (gleicher Block wie in der Funkübungs-App) ===== */
const DATA = {
  rgStation: 3,
  stationen: [1, 2, 3, 4],
  einheiten: ['33', '43', '44', '65', '74', '19/1', '19/2', '00'],
  fragen: [
    { id: 1, titel: 'Funkschatten',
      lage: 'Eure Einheit steht im Keller, der Empfang ist abgehackt. Was ist richtig?',
      opt: ['Sendetaste mehrfach drücken', 'Rufgruppe wechseln', 'Standort wechseln, Antenne frei und senkrecht halten'], ok: 2 },
    { id: 2, titel: 'TMO oder DMO',
      lage: 'Die Einheiten stimmen sich direkt an der Einsatzstelle ab, ohne Netz und ohne Leitstelle. Welche Betriebsart?',
      opt: ['DMO (Direct Mode Operation, Direktbetrieb von Gerät zu Gerät)', 'TMO (Trunked Mode Operation, Betrieb über das Netz)', 'Beides geht nicht'], ok: 0 },
    { id: 3, titel: 'Fehlersuche',
      lage: 'Das Gerät ist an, der Akku ist voll, aber ihr hört den ELW nicht. Was prüft ihr zuerst?',
      opt: ['SI-Karte tauschen', 'Antenne abschrauben', 'Betriebsart (TMO oder DMO) und Rufgruppe prüfen'], ok: 2 },
    { id: 4, titel: 'Notruf im DMO',
      lage: 'Jemand löst im DMO (Direct Mode Operation) den Notruf aus. Wer hört mit?',
      opt: ['Alle Geräte in der DMO-Rufgruppe, das Mikrofon ist etwa 15 Sekunden offen', 'Nur die Leitstelle', 'Niemand, es wird nur ein Signal gesendet'], ok: 0 },
    { id: 5, titel: 'Akku',
      lage: 'Welche Aussage zum Akkuwechsel ist richtig?',
      opt: ['Kalte Akkus werden sofort geladen', 'Nur bei ausgeschaltetem Gerät, Kontakte sauber halten', 'Das geht auch bei laufendem Gerät'], ok: 1 },
    { id: 6, titel: 'Status ohne FMS',
      lage: 'Das Funkmeldesystem (FMS) ist ausgefallen. Ihr habt den Einsatzauftrag übernommen und seid auf dem Weg. Wie meldet ihr das?',
      opt: ['Status 3 über die Zifferntaste senden', 'Gar nicht, die Leitstelle erfährt es von selbst', 'Per Sprechfunk im Klartext mit Rufname melden'], ok: 2 },
    { id: 7, titel: 'Nachricht einstufen',
      lage: 'Ein Atemschutzgeräteträger setzt den Mayday-Ruf ab. Wie ist das einzustufen?',
      opt: ['Einfach', 'Blitz', 'Sofort'], ok: 1 },
    { id: 8, titel: 'Eintreffmeldung',
      lage: 'Ihr erreicht die Einsatzstelle. Wann darf die Eintreffmeldung abgegeben werden?',
      opt: ['Sobald die Einsatzstelle in Sicht ist', 'Erst am endgültigen Standort', 'Schon bei der Abfahrt'], ok: 1 },
    { id: 9, titel: 'Notruftaste',
      lage: 'Die Notruftaste wurde in der Jackentasche versehentlich gedrückt. Was tust du?',
      opt: ['Nichts, das merkt keiner', 'Leitstelle sofort informieren, dass es ein Versehen war', 'Gerät ausschalten und weitermachen'], ok: 1 },
    { id: 10, titel: 'Sendetaste',
      lage: 'Bei deiner Meldung geht der Anfang immer verloren. Was ist richtig?',
      opt: ['Lauter sprechen', 'Taste beim Sprechen kurz loslassen', 'Taste drücken, kurz warten, dann sprechen'], ok: 2 },
    { id: 11, titel: 'Mayday im Funkverkehr',
      lage: 'Ein Mayday wird abgesetzt. Was tun alle anderen in der Rufgruppe?',
      opt: ['Funkverkehr einstellen und mithören', 'Leiser weitersprechen', 'Sofort die Rufgruppe wechseln'], ok: 0 },
    { id: 12, titel: 'Tastensperre',
      lage: 'Wozu dient die Tastensperre am Handfunkgerät?',
      opt: ['Sie verschlüsselt den Funk', 'Sie erhöht die Reichweite', 'Sie verhindert versehentliche Eingaben, etwa einen Rufgruppenwechsel'], ok: 2 },
    { id: 13, titel: 'DMO Reichweite',
      lage: 'Im DMO reißt die Verbindung zwischen zwei weit entfernten Einheiten ab. Warum?',
      opt: ['Im DMO funken die Geräte direkt miteinander, die Reichweite ist begrenzt', 'Die Leitstelle hat die Rufgruppe gesperrt', 'Der Akku sendet nach einer Stunde schwächer'], ok: 0 },
    { id: 14, titel: 'Gerät einschalten',
      lage: 'Du schaltest dein Funkgerät ein und steckst es in die Tasche. Was stellst du sicher?',
      opt: ['Die Lautstärke steht auf Maximum, damit du alles hörst', 'Das Gerät bleibt auf der Rufgruppe vom letzten Einsatz', 'Betriebsart und Rufgruppe passen zur Aufgabe, die Tastensperre ist aktiv'], ok: 2 },
    { id: 15, titel: 'Personenbezogene Daten',
      lage: 'Ihr betreut an der Einsatzstelle eine verletzte Person. Was gehört nicht in den Funkverkehr?',
      opt: ['Die Anzahl der Verletzten', 'Name, Anschrift und/oder Geburtsdatum der Person', 'Der Treffpunkt für den Rettungsdienst'], ok: 1 }
  ]
};
/* ===== Ende DATA ===== */

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const q = new URLSearchParams(location.search);
let station = parseInt(q.get('s'), 10);
if (!(station >= 1 && station <= 4)) station = 1;
const kanal = (q.get('k') || '').replace(/[^A-Za-z0-9_-]/g, '');
const BASE = 'https://ntfy.sh/';
$('st').textContent = 'Station ' + station;

/* Zufall aus Zeichenkette (gleiche Eingabe, gleiche Fragen auf jedem Handy) */
function xmur3(str){ let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }; }
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fragenFuer(run, einheit, st){
  const rnd = mulberry32(xmur3(run + '|' + einheit)());
  const ids = DATA.fragen.map(f => f.id);
  for (let i = ids.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  // Fragen, die diese Einheit in einer früheren Runde schon hatte, kommen ans Ende der Reihenfolge
  const alt = new Set(); got.forEach(m => { if (m.t === 'ans' && m.e === einheit && m.r !== run) m.a.forEach(x => alt.add(x[0])); });
  const rest = ids.filter(i => !alt.has(i)).concat(ids.filter(i => alt.has(i)));
  const slot = st > DATA.rgStation ? st - 2 : st - 1, n = rest.length, a = (2 * slot) % n, b = (2 * slot + 1) % n;
  return [rest[a], rest[b]];
}

/* Antworten je Einheit und Frage in zufälliger, aber stabiler Reihenfolge (data-i bleibt der Originalindex, die Auswertung ändert sich nicht) */
function antwortFolge(f, einheit){
  const rnd = mulberry32(xmur3(run + '|' + einheit + '|' + station + '|' + f.id + '|a')());
  const o = f.opt.map((_, i) => i);
  for (let i = o.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
  return o;
}

let run = null, einheiten = DATA.einheiten, ordnung = {}, got = [], sel = {}, cur = null;

function meldung(html, ok){ const m = $('state'); m.className = 'msg' + (ok ? ' ok' : ''); m.innerHTML = html; }

async function laden(){
  $('pick').classList.add('hide'); $('out').classList.add('hide');
  if (!kanal){ meldung('<h2>Link unvollständig</h2>Bitte den QR-Code an der Station erneut scannen.'); return; }
  meldung('Verbindung wird aufgebaut ...');
  try {
    const r = await fetch(BASE + kanal + '/json?poll=1&since=12h');
    const txt = await r.text();
    got = txt.split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch(e){ return null; } }).filter(m => m && m.event === 'message')
      .map(m => { try { return Object.assign(JSON.parse(m.message), { _t: m.time }); } catch(e){ return null; } }).filter(Boolean);
  } catch(e){ meldung('<h2>Keine Verbindung</h2>Bitte Internet am Handy prüfen und erneut versuchen.<button class="btn" id="retry">Erneut versuchen</button>'); $('retry').onclick = laden; return; }
  const ctl = got.filter(m => m.t === 'start' || m.t === 'end').sort((a, b) => a._t - b._t);
  const last = ctl[ctl.length - 1];
  if (!last || last.t === 'end'){ meldung('<h2>Keine Übung aktiv</h2>Die Fragen sind freigeschaltet, sobald der ELW die Funkübung beginnt.<button class="btn" id="retry">Erneut prüfen</button>'); $('retry').onclick = laden; return; }
  run = last.r; einheiten = (last.e && last.e.length) ? last.e : DATA.einheiten; ordnung = last.o || {};
  $('state').className = 'hide';
  $('pills').innerHTML = einheiten.map(e => '<button class="pill" data-e="' + e + '">' + e + '</button>').join('');
  $('pick').classList.remove('hide');
}

function erledigt(e){
  const s = new Set();
  DATA.stationen.forEach(n => { if (store.get('fa_' + run + '_' + n + '_' + e, null)) s.add(n); });
  got.forEach(m => { if ((m.t === 'ans' || m.t === 'arr') && m.r === run && m.e === e) s.add(m.s); });
  return s;
}
function naechste(e, plus){
  const ord = (ordnung[e] && ordnung[e].length) ? ordnung[e] : DATA.stationen, d = erledigt(e); if (plus) d.add(plus);
  return ord.find(n => !d.has(n)) || null;
}
function weiter(e){ const n = naechste(e, station); return n ? 'Weiter zu <b>Station ' + n + '</b>.' : 'Alle Stationen geschafft.'; }
function bereits(e){
  const k = 'fa_' + run + '_' + station + '_' + e;
  return store.get(k, null) || got.find(m => (m.t === 'ans' || m.t === 'arr') && m.r === run && m.e === e && m.s === station) || null;
}
function show(einheit){
  cur = einheit; sel = {};
  $('pick').classList.add('hide');
  if (bereits(einheit)){
    $('out').classList.add('hide');
    meldung('<h2>Schon abgegeben</h2>Für Aidlingen ' + einheit + ' wurde an dieser Station bereits geantwortet. Jede Einheit beantwortet die Fragen nur einmal.<p class="small"><button class="link" id="chg2">Andere Einheit wählen</button></p>', true);
    $('chg2').onclick = () => { $('state').className = 'hide'; $('pick').classList.remove('hide'); };
    return;
  }
  $('state').className = 'hide';
  if (station === DATA.rgStation){
    $('out').classList.add('hide');
    meldung('<h2>Station 3 erreicht</h2>Aidlingen ' + einheit + ': Meldet die Station jetzt, danach per Funk beim ELW anmelden und die Anweisung abwarten.<button class="btn" id="arr">Station melden</button><p class="small"><button class="link" id="chg2">Andere Einheit wählen</button></p>');
    $('chg2').onclick = () => { $('state').className = 'hide'; $('pick').classList.remove('hide'); };
    $('arr').onclick = async () => {
      const b = $('arr'); b.disabled = true; b.textContent = 'Wird gesendet ...';
      const msg = { t: 'arr', r: run, e: einheit, s: station, ts: Date.now() };
      try {
        const r = await fetch(BASE + kanal, { method: 'POST', body: JSON.stringify(msg) });
        if (!r.ok) throw new Error('http ' + r.status);
        store.set('fa_' + run + '_' + station + '_' + einheit, msg);
        meldung('<h2>Gemeldet</h2>Der ELW weiß Bescheid. Jetzt per Funk beim ELW melden und die Anweisung abwarten.<p class="small">' + weiter(einheit) + '</p>', true);
      } catch(e){ b.disabled = false; b.textContent = 'Senden fehlgeschlagen, erneut versuchen'; }
    };
    return;
  }
  const ids = fragenFuer(run, einheit, station);
  $('who').textContent = 'Aidlingen ' + einheit + ' · Station ' + station;
  const nx = naechste(einheit); $('who').innerHTML += nx && nx !== station ? '<br><span style="color:var(--amber)">Hinweis: Eure nächste Station ist Station ' + nx + '.</span>' : '';
  $('qs').innerHTML = ids.map((id, n) => {
    const f = DATA.fragen.find(x => x.id === id);
    return '<div class="card" data-q="' + f.id + '"><div class="qn">Frage ' + (n + 1) + ' von 2</div><div class="qt">' + f.titel + '</div><p class="ql">' + f.lage + '</p>' +
      antwortFolge(f, einheit).map((i, pos) => '<div class="opt" data-i="' + i + '"><b>' + 'ABC'[pos] + '</b><span>' + f.opt[i] + '</span></div>').join('') + '</div>';
  }).join('');
  $('send').disabled = true; $('send').textContent = 'Antworten abschicken';
  $('out').classList.remove('hide');
}
$('pills').addEventListener('click', ev => { const b = ev.target.closest('.pill'); if (b) show(b.dataset.e); });
$('qs').addEventListener('click', ev => {
  const o = ev.target.closest('.opt'); if (!o) return;
  const card = o.closest('.card'); card.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === o));
  sel[card.dataset.q] = +o.dataset.i;
  $('send').disabled = Object.keys(sel).length < 2;
});
$('chg').addEventListener('click', () => { $('out').classList.add('hide'); $('pick').classList.remove('hide'); });
$('send').addEventListener('click', async () => {
  const b = $('send'); b.disabled = true; b.textContent = 'Wird gesendet ...';
  const msg = { t: 'ans', r: run, e: cur, s: station, a: Object.keys(sel).map(id => [+id, sel[id]]), ts: Date.now() };
  try {
    const r = await fetch(BASE + kanal, { method: 'POST', body: JSON.stringify(msg) });
    if (!r.ok) throw new Error('http ' + r.status);
    store.set('fa_' + run + '_' + station + '_' + cur, msg);
    $('out').classList.add('hide');
    meldung('<h2>Übermittelt</h2>Die Antworten sind beim ELW angekommen. Die Auswertung macht der ELW.<p class="small">' + weiter(cur) + '</p>', true);
  } catch(e){ b.disabled = false; b.textContent = 'Senden fehlgeschlagen, erneut versuchen'; }
});
laden();
</script>
</body>
</html>
